name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:smoke
      - name: Acceptance tests must be red on the boilerplate
        run: if npm run test:acceptance; then echo 'acceptance tests passed on the unmodified boilerplate' && exit 1; fi
      - run: npm run build
